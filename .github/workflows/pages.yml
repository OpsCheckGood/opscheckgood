name: Deploy to GitHub Pages

# Publishes the static build to https://opscheckgood.github.io/opscheckgood/.
#
# github.io is a long-established host that DoD web filters generally admit,
# which a fresh domain is not until a categoriser has seen it. This mirror
# exists so the tools can be reached from a government computer while the
# main domain works its way through that process.
#
# Publishes by pushing `dist/` to the `gh-pages` branch, the same way
# AF-VCD/pdf-bullets does. GitHub enables Pages on its own when that branch
# exists, which the artifact-based deploy could not do: the workflow token
# is not allowed to create the Pages site on a personal account, so that
# route needs a one-time change in the repository settings that is easy to
# miss. This route needs none.
#
# The repository must be public. GitHub only serves Pages from a private
# repository on a paid plan.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The site is mounted under the repository name, so every internal link
      # and asset URL has to carry that prefix.
      - name: Build
        run: npm run build
        env:
          PUBLIC_BASE: /opscheckgood/

      # Hard constraint 1 applies to this mirror exactly as it does to the
      # main site.
      - name: Offline check
        run: npm run verify:offline

      # Pages runs Jekyll over a branch deploy unless told not to, and Jekyll
      # drops every directory starting with an underscore, which is where
      # Astro puts all of its assets.
      - name: Push to gh-pages
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} to GitHub Pages"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
